<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학기말 교과협의록</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#d9dde3;--ink:#1f2933;--sub:#5f6b7a;--pri:#2457c5;--pri2:#e8eefb;--ok:#1d8a4e;--warn:#b7791f;--bad:#c53030}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;font-size:15px}
header.top{background:#1f3b73;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{font-size:19px;margin:0}
header.top .mode{font-size:13px;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:20px}
header.top .sp{flex:1}
header.top a{color:#cfe0ff;font-size:13px}
#apiState{font-size:13px;padding:3px 10px;border-radius:20px;white-space:nowrap}
#apiState.ok{background:rgba(74,222,128,.18);color:#bbf7d0}
#apiState.chk{background:rgba(255,255,255,.12);color:#dbe4f3}
#apiState.fail{background:#c53030;color:#fff;cursor:pointer;font-weight:bold}
#apiState.none{background:#b7791f;color:#fff;cursor:pointer}
#apiState.demo{background:rgba(255,255,255,.15);color:#fde68a}
main{padding:16px}
.layout{display:grid;grid-template-columns:minmax(440px,1fr) auto;gap:18px;align-items:start}
@media (max-width:1250px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 small{font-weight:normal;color:var(--sub);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px}
.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--sub)}
.f.w2{grid-column:span 2}.f.wall{grid-column:1/-1}
.f input,.f select,.f textarea,textarea{font:inherit;font-size:14px;color:var(--ink);padding:6px 8px;border:1px solid #c4cad3;border-radius:6px;background:#fff;width:100%}
textarea{resize:vertical;min-height:62px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid #9db7ee;border-color:var(--pri)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px}
.btn{font:inherit;font-size:14px;border:1px solid #b9c2cf;background:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f0f3f8}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#1c4aa8}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{font-size:12.5px;padding:4px 9px}
.btn.del{color:var(--bad);border-color:#e9b8b8}
.btn:disabled{opacity:.5;cursor:default}
.row-card{border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:8px;padding:10px 12px;margin:10px 0;background:#fbfcfe}
.row-card.exam{border-left-color:#8a4fd0}
.rc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:bold}
.rc-head .sp{flex:1}
.calc{margin:8px 0 6px;padding:7px 10px;background:var(--pri2);border-radius:6px;font-size:13.5px;line-height:1.6}
.calc b{color:var(--pri)}
.calc .err{color:var(--bad)}
.note-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip{font-size:13px;border:1px dashed #8fa6d6;background:#fff;color:var(--pri);border-radius:20px;padding:4px 10px;cursor:pointer}
.chip:hover{background:var(--pri2)}
.hint{font-size:13px;color:var(--sub);margin:4px 0}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px;line-height:1.55}
.banner.warn{background:#fff7e6;border:1px solid #f3d29b}
.banner.info{background:#eaf2ff;border:1px solid #bcd2f7}
.banner.ok{background:#e8f7ee;border:1px solid #a9dcbc}
.actions{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.sub-rows .sr{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:6px;margin:4px 0;align-items:end}
.preview-wrap{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;border-radius:6px}
.page{width:210mm;min-height:297mm;padding:14mm 14mm;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);margin:0 auto 16px}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 16px;border:1px solid var(--line);border-radius:8px 8px 0 0;background:#e9ecf1;cursor:pointer;font-size:14px}
.tab.on{background:#fff;border-bottom-color:#fff;font-weight:bold;color:var(--pri)}
table.lst{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.lst th,table.lst td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.lst th{background:#f0f2f6;font-size:13px;color:var(--sub)}
.st-ok{color:var(--ok);font-weight:bold}.st-no{color:var(--bad)}
.set-tbl{width:100%;border-collapse:collapse;font-size:14px}
.set-tbl td,.set-tbl th{border:1px solid var(--line);padding:4px}
.set-tbl th{background:#f0f2f6;font-size:13px}
.set-tbl input{width:100%;border:0;padding:5px;font:inherit;font-size:14px}
details summary{cursor:pointer;font-weight:bold;margin:6px 0}
ol.guide li{margin:5px 0;line-height:1.55}
code{background:#eef1f5;padding:1px 5px;border-radius:4px;font-size:13px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:90vw}
#toast.show{opacity:1}
footer{color:var(--sub);font-size:12.5px;text-align:center;padding:16px}
footer a{color:var(--sub)}

/* ===== 문서(한글 양식 모양) ===== */
.doc{font-family:'HCR Batang','함초롬바탕','Batang','바탕','Noto Serif KR',serif;font-size:10.5pt;color:#000;line-height:1.55}
.doc-head{display:flex;align-items:flex-end;margin-bottom:8px}
.doc-title{flex:1;text-align:center;font-size:21pt;font-weight:bold;letter-spacing:1px;padding-bottom:4px}
.appr{border-collapse:collapse}
.appr th,.appr td{border:1px solid #000;font-size:9.5pt;padding:2px 6px;text-align:center;font-weight:normal;min-width:60px}
.appr td{height:44px;vertical-align:middle}
.appr th.v{min-width:0;width:24px;line-height:1.3}
table.t{width:100%;border-collapse:collapse;table-layout:fixed}
table.t th,table.t td{border:1px solid #000;padding:4px 5px;vertical-align:middle;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
table.t th{background:#e8e8e8;font-weight:bold}
table.t td.left{text-align:left;vertical-align:top}
table.main>tbody>tr>th{font-size:10.5pt}
.content{padding:8px 8px!important}
.content p{margin:3px 0}
.content .sec{font-weight:bold;margin-top:10px}
.content .sec:first-child{margin-top:0}
.content .sub{margin:6px 0 4px 6px}
.content .ind{margin-left:14px}
.content .note{margin:4px 0 2px 14px;text-indent:-0px}
.content .formula{margin:1px 0 4px 30px}
table.it{width:100%;border-collapse:collapse;table-layout:auto;margin:4px 0 6px;font-size:9pt}
table.it th,table.it td{border:1px solid #000;padding:3px 3px;text-align:center;vertical-align:middle;word-break:keep-all;overflow-wrap:anywhere;line-height:1.35}
table.it th{background:#e8e8e8}
table.it td.l{text-align:left;font-size:8.5pt;min-width:120px}
table.it .nw{white-space:nowrap}
table.it td.ar{min-width:70px}
table.it td.mt{min-width:105px}
table.it td.l{width:30%}
.reg{border:1px solid #000;padding:6px 8px;margin:4px 0;font-size:9.5pt;line-height:1.55}
.gdoc .gtitle{font-weight:bold;font-size:13pt;margin:0 0 10px}
.gdoc .gsec{font-weight:bold;font-size:11.5pt;margin:14px 0 4px}
.gdoc .gsub{font-weight:bold;margin:12px 0 4px}
.gdoc .exbox{border:1px solid #000;padding:6px 8px;margin:4px 0 10px}
.gdoc .exbox .exname{font-weight:bold}

.prog{margin-top:14px}.prog .bar{height:10px;background:#e3e8f0;border-radius:6px;overflow:hidden}.prog .bar i{display:block;height:100%;width:0;background:var(--pri);border-radius:6px;transition:width .25s}.prog .pt{font-size:14px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between}
#busy{position:fixed;inset:0;background:rgba(20,30,50,.28);display:none;align-items:center;justify-content:center;z-index:98}
#busy.on{display:flex}
#busy .bx{background:#fff;border-radius:12px;padding:18px 22px;width:min(360px,86vw);box-shadow:0 8px 30px rgba(0,0,0,.2)}
#busy .bt{font-weight:bold;margin-bottom:10px}
#busy .bar{height:10px;background:#e3e8f0;border-radius:6px;overflow:hidden}
#busy .bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
#busy .bp{text-align:right;font-size:14px;color:var(--sub);margin-top:6px;font-weight:bold}
#printRoot{display:none}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  .print-page{page-break-after:always;break-after:page}
  .print-page:last-child{page-break-after:auto;break-after:auto}
  table.it tr{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <h1>학기말 교과협의록</h1><span class="mode" id="modeLabel"></span>
  <span class="sp"></span><span id="apiState" style="font-size:13px"></span><span id="verTag" class="mode" title="이 숫자가 바뀌었으면 새 버전이 반영된 것입니다"></span>
</header>
<main id="app"><p>불러오는 중…</p></main>
<footer>제작: 과학교사 구인회 · <span id="verFoot"></span> · <a href="#" id="modeSwitch"></a></footer>
<div id="printRoot"></div>
<div id="toast"></div>
<div id="busy"><div class="bx"><div class="bt" id="busyMsg">저장하는 중…</div><div class="bar"><i id="busyBar"></i></div><div class="bp" id="busyPct">0%</div></div></div>
<datalist id="dlRoster"></datalist>
<datalist id="dlAreas"></datalist>
<datalist id="dlSubjects"></datalist>

<script>
'use strict';
const APP_VERSION = '1.7';
const APP_DATE = '2026.11.19';
/* =========================================================
   기본 문구 (학업성적관리규정) — 평가부장 설정에서 수정 가능
   ========================================================= */
const REG_DEFAULT = {
  r15_1: "제15조(인정점 부여)\n 1. 인정점 부여 기준\n가. 교과목별 정기시험 및 수행평가에 참여하지 못한 학생(결시학생)의 성적처리는 결시한 당해 학기 내에서 응시한 정기시험의 성적, 평균점을 고려한 성적 및 기타 성적의 일정 비율을 환산한 성적(인정점)을 학기말에 부여한다.",
  r15_1na: "나. 정기시험 및 수행평가를 결시한 경우 다음과 같이 인정점을 부여한다.\n1) 정기시험을 결시한 경우 당해 학기 내에 응시한 다른 고사의 점수를 인정점 비율에 따라 부여한다. 즉 1회고사를 결시한 경우 2회고사 점수를, 2회고사를 결시한 경우 1회고사 점수를 인정점 비율에 따라 부여한다.",
  r15_2h: " 2. 정기시험의 결시학생",
  r15_2ga6: "가. ‘100% 인정점’을 부여하는 경우\n6) 전·편입학으로 인한 학교장이 인정하는 결시",
  r15_2na1: "나. 다음 각 호의 하나에 해당하는 경우에는 ‘80% 인정점’을 부여한다.\n1) 질병으로 인한 결시\n가) 질병결임을 증명할 수 있는 의사의 진단서 또는 의견서(병명, 진료기간 등이 기록된 의사 소견서, 진료 확인서 등의 증빙서류)를 첨부한 결석 신고서를 결석한 날부터 5일 이내에 제출하여 학교장의 승인을 받은 경우",
  r15_2da: "다. 석차 산출을 위한 재적수에 포함되는 학생 성적의 해당과목 ‘최하점의 -1점’을 부여하는 경우는 다음과 같다.\n1. 미인정 결석으로 인한 결시\n바. 태만, 가출, 출석 거부 등 고의로 결시한 경우\n사. 기타 합당하지 않은 사유로 결시한 경우\n2. 인정 결석으로 인한 결시\n가. 정기시험기간 중 교외체험학습(단, 감염병의 전국적 유행 등 국가 재난에 준하는 상황에서는 학업성적관리위원회의 심의를 거쳐 인정점 부여 기준 달리 정하여 적용할 수 있다.)",
  r15_3: " 3. 수행평가 결시학생\n수행평가 미응시 학생의 수행평가 점수는 교과(학년)협의회에서 점수 부여 기준을 설정하고, 학업성적관리위원회의 심의를 거쳐 학교장이 결정한다.",
  r15_4: " 4. 재취학, 전ㆍ편입학 학생\n재취학, 전·편입학 학생이 원적교 고사에서 결시 등으로 성적이 없는 경우, 재취학, 전·편입학한 이후 성적을 기준으로 결시에 따른 인정점을 부여한다.",
  r16: "제16조(학업 성적 평가 결과 처리)\n3. 재취학, 전ㆍ편입학, 전출 학생 성적처리\n나. 재취학, 전ㆍ편입학 학생은 각 호에 따라 성적을 산출한다.\n3) 재취학, 전ㆍ편입학 이후 성적산출을 위한 원적교의 성적이 없을 경우에는 전ㆍ편입학 이후 취득한 평가의 성적을 반영한다. 다만, 결시 등의 사유로 인정점을 부여해야 하는 경우, ‘학업성적관리규정’에 따른다.",
  // 부여표 '인정점수 부여 근거' 칸
  bPerf: "제15조(인정점 부여) 3항\n수행평가 미응시 학생의 수행평가 점수는 교과(학년)협의회에서 점수 부여 기준을 설정하고, 학업성적관리위원회의 심의를 거쳐 학교장이 결정한다.",
  bExamIll: "제15조(인정점 부여) 2항\n나. ‘80% 인정점’을 부여하는 경우\n1) 질병으로 인한 결시",
  bExamUnexc: "제15조(인정점 부여) 2항\n다. 석차 산출을 위한 재적수에 포함되는 학생 성적의 ‘최하점의 –1점’을 부여하는 경우\n1. 미인정 결석으로 인한 결시\n바. 태만, 가출, 출석 거부 등 고의로 결석한 경우\n사. 기타 합당하지 않은 사유로 결시한 경우",
  bExamTrans: "제15조(인정점 부여) 4항\n재취학, 전·편입학 학생이 원적교 고사에서 결시 등으로 성적이 없는 경우, 재취학, 전·편입학한 이후 성적을 기준으로 결시에 따른 인정점을 부여한다.(세부 성적 산출 방법은 ‘제16조 3항 재취학, 전·편입학, 전출 학생 등의 성적 처리’ 참고)",
  bExamOther: "제15조(인정점 부여) 2항"
};
const REG_LABELS = {
  r15_1:'제15조 1항 가 (항상 포함)', r15_1na:'제15조 1항 나 (정기시험 있을 때)', r15_2h:'제15조 2항 제목', r15_2ga6:'제15조 2항 가 6) 전입', r15_2na1:'제15조 2항 나 1) 질병결', r15_2da:'제15조 2항 다 (최하점 -1점)', r15_3:'제15조 3항 (수행평가)', r15_4:'제15조 4항 (전입)', r16:'제16조 3항 (전입)',
  bPerf:'[부여표 근거] 수행평가', bExamIll:'[부여표 근거] 정기시험-질병결', bExamUnexc:'[부여표 근거] 정기시험-미인정결', bExamTrans:'[부여표 근거] 정기시험-전입', bExamOther:'[부여표 근거] 정기시험-기타'
};
const DEFAULT_SUBJECTS = ['국어','도덕','사회','역사','수학','과학','기술·가정','정보','영어','체육','음악','미술','한문'];
const DEFAULT_CFG = {
  year: new Date().getFullYear(),
  approvalLabels: '부장, 교감', approvalSigns: ', 전결',
  subjects: DEFAULT_SUBJECTS.map(n=>({name:n, teachers:{1:'',2:'',3:''}, areas:{1:'',2:'',3:''}})),
  roster: {1:[],2:[],3:[]},
  reg: {}
};
const REASONS = ['질병결','미인정결','인정결','전입','기타'];
const PERF_METHODS = [['origin','원적교 점수 인정'],['other','다른 수행평가(타영역) 점수의 ○%'],['avg','평균 비율 계산식'],['count','개수 × 배점'],['manual','직접 입력']];
const EXAM_METHODS = [['other','다른 정기시험 점수의 ○%'],['lowest','최하점의 -1점'],['manual','직접 입력']];
const EXAMS = ['1차 시험','2차 시험'];

/* ===================== 작은 도구들 ===================== */
const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s=>esc(s).replace(/\n/g,'<br>');
const clone = o=>JSON.parse(JSON.stringify(o));
const num = v=>{ if(v===''||v==null) return NaN; const x=parseFloat(String(v).replace(/,/g,'')); return x; };
const r2 = x=>Math.round(x*100+(x>=0?1e-7:-1e-7))/100;
const fmt = v=>{ const x=typeof v==='number'?v:num(v); return (x===undefined||isNaN(x)||!isFinite(x))?'':String(r2(x)); };
const pct = v=>{ const x=num(v); return isNaN(x)?100:x; };
function ro(w){ w=String(w||''); const c=w.charCodeAt(w.length-1); if(!(c>=0xAC00&&c<=0xD7A3)) return w+'(으)로'; const j=(c-0xAC00)%28; return w+((j===0||j===8)?'로':'으로'); }
function getPath(o,p){ return p.split('.').reduce((a,k)=>a==null?a:a[k],o); }
function setPath(o,p,v){ const ks=p.split('.'); const last=ks.pop(); const t=ks.reduce((a,k)=>a[k]??(a[k]={}),o); t[last]=v; }
function toast(msg,ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms); }
function debounce(fn,ms){ let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a),ms); }; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(s){ if(!s) return '     년    월    일'; const [y,m,d]=s.split('-'); return `${+y}년 ${+m}월 ${+d}일`; }
function lt(iso){ const d=new Date(iso); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
const split = s=>String(s||'').split(/[,，\n]/).map(x=>x.trim()).filter(Boolean);

async function api(action, data={}){
  if(!API_URL) throw new Error('서버 주소가 설정되지 않았습니다.');
  if(API_URL==='demo') return demoApi(action, data);
  const body = Object.assign({action}, VIEW==='admin'&&ADMIN_PW?{pw:ADMIN_PW}:{}, data);
  let txt;
  try{
    const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),25000);
    const res = await fetch(API_URL, {method:'POST', body: JSON.stringify(body), signal:ac.signal}); clearTimeout(to);
    txt = await res.text();
  }catch(e){ setSrv('fail', e.name==='AbortError'?'timeout':'network'); throw new Error(e.name==='AbortError'?'서버 응답이 너무 늦습니다. 잠시 후 다시 해 주세요.':'서버에 연결하지 못했습니다. 인터넷 연결이나 서버 주소를 확인해 주세요.'); }
  let j; try{ j=JSON.parse(txt); }catch(e){ setSrv('fail','badjson'); throw new Error('서버 응답을 읽지 못했습니다. (Apps Script 배포 설정을 확인하세요)'); }
  setSrv('ok');
  if(!j.ok){ const er=new Error(j.error||'서버 오류'); er.code=j.code||'';
    if(j.code==='AUTH' && VIEW==='admin' && !LOCKED){ ADMIN_PW=''; localStorage.removeItem('kc_pw'); setTimeout(()=>renderLock('login','비밀번호가 바뀌었거나 맞지 않습니다. 다시 입력해 주세요.'),0); }
    throw er; }
  return j;
}

const BUSY={n:0,v:0,h:null};
function busyDraw(){ $('#busyBar').style.width=BUSY.v+'%'; $('#busyPct').textContent=BUSY.v+'%'; }
async function busy(msg, p){
  if(BUSY.n++>0){ try{ return await p; } finally{ BUSY.n--; } }
  $('#busyMsg').textContent=msg+'…'; BUSY.v=0; busyDraw(); $('#busy').classList.add('on');
  clearInterval(BUSY.h); BUSY.h=setInterval(()=>{ if(BUSY.v<92){ BUSY.v+=BUSY.v<50?3:(BUSY.v<80?2:1); busyDraw(); } },90);
  try{ const r=await p; clearInterval(BUSY.h); BUSY.v=100; busyDraw(); await new Promise(z=>setTimeout(z,280)); return r; }
  finally{ clearInterval(BUSY.h); BUSY.n=0; $('#busy').classList.remove('on'); }
}
let PROG={v:0,cap:0,h:null};
function progStart(host){ // host: 요소 안에 진행 막대를 붙임
  host.insertAdjacentHTML('beforeend','<div class="prog" id="prog"><div class="bar"><i id="progBar"></i></div><div class="pt"><span>들어가는 중…</span><b id="progPct">0%</b></div></div>');
  PROG.v=0; PROG.cap=0; clearInterval(PROG.h);
  PROG.h=setInterval(()=>{ if(PROG.v<PROG.cap){ PROG.v=Math.min(PROG.cap,PROG.v+1); progDraw(); } },60);
}
function progDraw(){ const b=$('#progBar'), t=$('#progPct'); if(b) b.style.width=PROG.v+'%'; if(t) t.textContent=PROG.v+'%'; }
function progTo(p,cap){ PROG.v=Math.max(PROG.v,p); PROG.cap=Math.max(PROG.v,cap??p); progDraw(); }
function progEnd(){ clearInterval(PROG.h); PROG.v=100; progDraw(); }
function progFail(){ clearInterval(PROG.h); const g=$('#prog'); if(g) g.remove(); $$('[data-act="doLogin"],[data-act="doCreatePw"]').forEach(b=>b.disabled=false); }
async function afterLogin(){ progTo(40,65); try{ await loadCfg(); }catch(e){} progTo(65,95); await loadAdminData(); progEnd(); await new Promise(r=>setTimeout(r,250)); LOCKED=false; renderAdmin(); updateApiState(); }
function demoApi(action,d){ // 연습 모드: 이 브라우저에만 저장
  const st = JSON.parse(localStorage.getItem('kc_demo')||'{}');
  const save=()=>localStorage.setItem('kc_demo',JSON.stringify(st));
  if(action==='ping') return {ok:true};
  if(action==='get') return {ok:true, value: st[d.key]?st[d.key].value:null};
  if(action==='set'||action==='submit'){ st[d.key]={value:d.value, updated:new Date().toISOString()}; save(); return {ok:true}; }
  if(action==='remove'){ delete st[d.key]; save(); return {ok:true}; }
  if(action==='list') return {ok:true, items:Object.keys(st).filter(k=>k.startsWith(d.prefix||'')).map(k=>({key:k, value:st[k].value, updated:st[k].updated}))};
  return {ok:false,error:'?'};
}

/* ===================== 계산 ===================== */
function reasonLabel(r){ return r.reason==='기타' ? (r.reasonText||'기타') : (r.reason||''); }
function reasonPhrase(r){ return ({'질병결':'질병결','미인정결':'미인정 결석','인정결':'출석인정 결석','전입':'전입'})[r.reason] || (r.reasonText||'결시'); }

function perfCalc(r){
  const R=pct(r.ratio); let base=NaN, score=NaN, text='', formula='';
  switch(r.method){
    case 'origin':
      base=num(r.base); score=base*R/100;
      text=`원적교(${r.originArea||'   '}) 점수 인정`+(R!==100?` ${R}%`:'');
      if(R!==100) formula=`${fmt(base)}점 × ${R/100} = ${fmt(score)}점`;
      break;
    case 'other':
      base=num(r.base); score=base*R/100;
      text=`기준점수(타영역)의 ${R}%`;
      formula=`${r.area||'해당 평가'}: ${fmt(base)}점 × ${R/100} = ${fmt(score)}점`;
      break;
    case 'avg': {
      const a=num(r.avgAbs), t=num(r.avgTake), s=num(r.takeScore);
      base=a/t*s; score=base*R/100;
      text=`기준점수의 ${R}%\n(기준점수는 계산식 활용 산출)`;
      formula=`결시고사 평균(${fmt(a)}) ÷ 응시(기준)고사 평균(${fmt(t)}) × 응시(기준)고사 점수(${fmt(s)}) × ${R}% = ${fmt(score)}점`;
      break; }
    case 'count': {
      const c=num(r.count), p=num(r.per), mx=num(r.max); const raw=c*p;
      base=isNaN(mx)?raw:Math.min(raw,mx); score=base;
      const u=r.unit||'학습지';
      text=`(${u} 개수×${fmt(p)||'○'})로 점수 인정`;
      formula=`${u} 개수(${fmt(c)}개) × ${fmt(p)} = ${fmt(raw)}점`+(!isNaN(mx)&&raw>mx?` → 만점(${fmt(mx)}점) 적용`:'');
      break; }
    default:
      text=r.methodText||''; base=num(r.base); score=num(r.score);
  }
  return {text, base, score, formula};
}
function perfAutoNote(r,m){
  const c=perfCalc(r), B=fmt(c.base)||'○', R=pct(r.ratio), area=r.area||'해당';
  const subj=r.subj||subjName(m)||'';
  const plan=`‘${m.year}학년도 ${m.sem}학기 ${subj}과 평가 계획’`;
  const tr=r.reason==='전입';
  let nat=String(r.nature||'').trim(); if(nat && !/[.。]$/.test(nat)) nat+='.';
  const pre = nat ? `‘${area}’ 수행평가는 ${nat} ` : '';
  const body=(()=>{ switch(r.method){
    case 'origin': return (tr?(nat?`수행평가 실시 이후 전입하여 다른 학생에 비해 수행평가를 준비할 시간이 부족하고, 단시간에 수행평가를 진행하거나 대체 과제를 제시하기 어렵다고 판단됨. `:`수행평가 실시 이후 전입하여 ‘${area}’ 수행평가를 준비하고 응시할 시간이 부족하고 대체 과제 제시가 어렵다고 판단됨. `):`${ro(reasonPhrase(r))} 인하여 ‘${area}’ 수행평가에 응시하지 못함. `)+`이에 원적교에서 응시한 유사 영역의 수행평가 ‘${r.originArea||'   '}’ 점수(${B}점)를 ${R}% 인정하여 부여함.`;
    case 'other': return (tr?`원적교에 ‘${area}’에 해당하는 수행평가 성적이 없으므로 ${plan}에 의거하여 `:`${ro(reasonPhrase(r))} 인하여 ‘${area}’ 수행평가에 응시할 수 없는 상황이므로 ${plan}의 수행평가 미응시자 처리 기준에 의거하여 `)+`당해 학기 내에 응시한 다른 수행평가 ‘${r.otherArea||'   '}’ 점수(${B}점)를 기준점수로 ${R}% 인정점을 부여함.`;
    case 'avg': return (tr?`원적교에서 ‘${area}’에 해당하는 수행평가를 실시하지 않아 점수가 없으므로, `:`${ro(reasonPhrase(r))} 인하여 ‘${area}’ 수행평가에 응시하지 못하였으므로, `)+`해당 학년·해당 교과의 평균을 고려하여 인정점 비율(${R}%)에 따라 인정점을 부여함. (응시(기준)고사: ${r.otherArea||'   '})`;
    case 'count': return (tr?`전입으로 인해 전입 이전의 본교 학습활동을 수행하지 못하였으므로, 전입 이후 `:'')+`제출한 ${r.unit||'학습지'}의 개수에 ×${fmt(r.per)||'○'}를 계산하여 점수를 부여함.`;
    default: return '';
  }})();
  return body ? pre+body : (nat?pre.trim():'');
}
function examCalc(e, s){
  const R=pct(e.ratio), base=num(s.base); let score=NaN;
  if(e.method==='other') score=base*R/100;
  else if(e.method==='lowest') score=isNaN(base)?NaN:Math.max(0,base-1);
  else score=num(s.score);
  return score;
}
function examText(e){
  const R=pct(e.ratio);
  if(e.method==='other') return `기준점수(${e.reason==='전입'?'본교 ':''}${e.otherExam||'다른 정기시험'})의 ${R}%`;
  if(e.method==='lowest') return '최하점의 -1점';
  return e.methodText||'';
}
function examAutoNote(e,m){
  const R=pct(e.ratio), subs=(e.subjects||[]).map(s=>s.subj||subjName(m)).filter(Boolean);
  const sj=subs.join('·')||'해당', bs=(e.subjects||[]).map(s=>fmt(s.base)+'점').join(', ');
  const ex=e.exam||'정기시험';
  if(e.method==='other'){
    if(e.reason==='전입') return `원적교 ${ex} 점수 중 ${sj} 교과 점수가 없으므로, 본교에서 응시한 ${e.otherExam||'다른 정기시험'} ${sj} 점수(${bs})를 ${R}% 인정하여 부여하고자 함.`;
    return `${ro(reasonPhrase(e))} 인하여 ${ex}에 결시하였으므로, 당해 학기 내에 응시한 ${e.otherExam||'다른 정기시험'} 점수를 기준점수로 ${R}% 인정점을 부여함.`;
  }
  if(e.method==='lowest') return `${ro(reasonPhrase(e))} 인하여 ${ex}에 결시하였으므로, 해당 과목 최하점의 -1점을 부여함.`;
  return '';
}
const noteOf = (o,m,kind)=> o.noteEdited ? (o.note||'') : (kind==='exam'?examAutoNote(o,m):perfAutoNote(o,m));
function basisOf(kind, o){
  if(o.basis && String(o.basis).trim()) return o.basis;

}

/* ===================== 협의록 데이터 ===================== */
function subjName(m){ return m.subject==='__custom' ? (m.subjectCustom||'').trim() : (m.subject||''); }
function curSem(){ const mo=new Date().getMonth()+1; return (mo>=8||mo<=2)?'2':'1'; }
function newMinutes(){ return {year:String(CFG.year), grade:'3', sem:curSem(), subject:'', subjectCustom:'', date:todayISO(), t1:'13:00', t2:'13:20', place:'', teachers:'', none:false, perf:[], exam:[], agendaManual:false, agenda:'', extraTitle:'', extra:''}; }
const mkey = m=>`minutes|${m.year}|${m.grade}|${m.sem}|${subjName(m)}`;
function newPerf(m, stu){
  const r={sid:'',name:'',reason:'질병결',reasonText:'',subj:'',area:'',nature:'',method:'origin',originArea:'',otherArea:'',ratio:'100',base:'',avgAbs:'',avgTake:'',takeScore:'',unit:'학습지',count:'',per:'',max:'100',methodText:'',score:'',note:'',noteEdited:false};
  const sc=subjCfg(subjName(m)); const areas=sc?split(sc.areas[m.grade]):[]; if(areas.length===1) r.area=areas[0];
  if(stu){ r.sid=stu.sid; r.name=stu.name; if(REASONS.includes(stu.reason)) r.reason=stu.reason; else if(stu.reason){ r.reason='기타'; r.reasonText=stu.reason; } }
  applyPerfDefaults(r); return r;
}
function applyPerfDefaults(r){
  if(r.reason==='전입'){ r.method='origin'; r.ratio='100'; }
  else if(r.reason==='질병결'){ r.method='other'; r.ratio='80'; }
  else { r.method='other'; r.ratio= r.reason==='인정결'?'100':''; }
}
function newExam(m, stu, admin){
  const e={sid:'',name:'',reason:'질병결',reasonText:'',exam:'1차 시험',method:'other',otherExam:'2차 시험',ratio:'100',methodText:'',basis:'',subjects:[{subj:admin?'':'',base:'',score:''}],note:'',noteEdited:false};
  if(stu){ e.sid=stu.sid; e.name=stu.name; if(REASONS.includes(stu.reason)) e.reason=stu.reason; else if(stu.reason){e.reason='기타';e.reasonText=stu.reason;} }
  applyExamDefaults(e); return e;
}
function applyExamDefaults(e){
  if(e.reason==='전입'){ e.method='other'; e.ratio='100'; }
  else if(e.reason==='질병결'){ e.method='other'; e.ratio='80'; }
  else if(e.reason==='미인정결'){ e.method='lowest'; }
  else if(e.reason==='인정결'){ e.method='other'; e.ratio='100'; }
  e.otherExam = e.exam==='1차 시험'?'2차 시험':'1차 시험';
}
function titleFor(rows,word){ const tr=rows.some(r=>r.reason==='전입'), ot=rows.some(r=>r.reason!=='전입'); return tr&&!ot?`전입생 ${word}`:(!tr?`${word} 결시생`:`${word} 결시생(전입생 포함)`); }
function agendaList(m){
  if(m.agendaManual) return String(m.agenda||'').split('\n').map(s=>s.replace(/^\s*-\s*/,'').trim()).filter(Boolean);
  const a=[];
  if(m.none) a.push('인정점 부여 대상 학생 확인');
  else { if(m.perf.length) a.push(titleFor(m.perf,'수행평가')+' 인정점 부여'); if(m.exam.length) a.push(titleFor(m.exam,'정기시험')+' 인정점 부여'); }
  if(String(m.extraTitle||'').trim()) a.push(m.extraTitle.trim());
  return a;
}

function approvalBox(){
  const L=split(CFG.approvalLabels); const S=String(CFG.approvalSigns||'').split(',').map(s=>s.trim());
  if(!L.length) return '';
  return `<table class="appr"><tr><th class="v" rowspan="2">결<br>재</th>${L.map(l=>`<th>${esc(l)}</th>`).join('')}</tr><tr>${L.map((l,i)=>`<td>${esc(S[i]||'')}</td>`).join('')}</tr></table>`;
}
function normPerfRows(m){ return m.perf.map(r=>{ const c=perfCalc(r); return {sid:r.sid,name:r.name,reason:reasonLabel(r),rk:r.reason,subj:r.subj||subjName(m),area:r.area,methodText:c.text,base:c.base,score:c.score,formula:c.formula,note:noteOf(r,m,'perf'),method:r.method,basis:basisOf('perf',r)}; }); }
function normExamRows(m){ return m.exam.map(e=>({sid:e.sid,name:e.name,reason:reasonLabel(e),rk:e.reason,exam:e.exam,methodText:examText(e),note:noteOf(e,m,'exam'),basis:basisOf('exam',e),subjects:(e.subjects||[]).map(s=>({subj:s.subj||subjName(m),base:num(s.base),score:examCalc(e,s)}))})); }

function perfTableHTML(rows, withBasis){
  if(!rows.length) return '';
  // 같은 학생(학번+사유) 묶기, 그 안에서 같은 교과 묶기
  const groups=[]; rows.forEach(r=>{ const g=groups[groups.length-1]; if(g&&g.sid===r.sid&&g.reason===r.reason&&g.name===r.name) g.rows.push(r); else groups.push({sid:r.sid,name:r.name,reason:r.reason,basis:r.basis,rows:[r]}); });
  let h=`<table class="it"><tr><th class="nw">평가<br>종류</th><th class="nw">학번</th><th class="nw">이름</th>${withBasis?'<th>인정점수 부여 근거<br>(학업성적관리규정)</th>':''}<th class="nw">인정<br>사유</th><th class="nw">교과</th><th>평가명</th><th>인정점<br>부과 방법</th><th class="nw">기준<br>점수</th><th class="nw">인정점</th></tr>`;
  let first=true;
  groups.forEach(g=>{
    g.rows.forEach((r,i)=>{
      h+='<tr>';
      if(first){ h+=`<td class="nw" rowspan="${rows.length}">수행<br>평가</td>`; first=false; }
      if(i===0){ const rs=g.rows.length; h+=`<td class="nw" rowspan="${rs}">${esc(g.sid)}</td><td class="nw" rowspan="${rs}">${esc(g.name)}</td>`+(withBasis?`<td rowspan="${rs}" class="l">${nl(g.basis)}</td>`:'')+`<td class="nw" rowspan="${rs}">${esc(g.reason)}</td>`; }
      if(i===0||g.rows[i-1].subj!==r.subj){ let k=i; while(k+1<g.rows.length&&g.rows[k+1].subj===r.subj) k++; h+=`<td class="nw" rowspan="${k-i+1}">${esc(r.subj)}</td>`; }
      h+=`<td class="ar">${esc(r.area)}</td><td class="mt">${nl(r.methodText)}</td><td class="nw">${fmt(r.base)}</td><td class="nw">${fmt(r.score)}</td></tr>`;
    });
  });
  return h+'</table>';
}
function examTableHTML(rows, withBasis){
  if(!rows.length) return '';
  let h=`<table class="it"><tr><th class="nw">평가<br>종류</th><th class="nw">학번</th><th class="nw">이름</th>${withBasis?'<th>인정점수 부여 근거<br>(학업성적관리규정)</th>':''}<th class="nw">인정<br>사유</th><th>인정점 부과 방법</th><th class="nw">${withBasis?'해당<br>교과':'교과'}</th><th class="nw">기준<br>점수</th><th class="nw">인정점</th></tr>`;
  // 같은 시험끼리 평가종류 칸 묶기
  rows.forEach((e,ei)=>{
    const subs=e.subjects.length?e.subjects:[{subj:'',base:NaN,score:NaN}]; const rs=subs.length;
    let examSpan=0; if(ei===0||rows[ei-1].exam!==e.exam){ for(let k=ei;k<rows.length&&rows[k].exam===e.exam;k++) examSpan+=Math.max(1,rows[k].subjects.length); }
    subs.forEach((s,i)=>{
      h+='<tr>';
      if(i===0){ if(examSpan) h+=`<td class="nw" rowspan="${examSpan}">${esc(e.exam).replace(' ','<br>')}</td>`; h+=`<td class="nw" rowspan="${rs}">${esc(e.sid)}</td><td class="nw" rowspan="${rs}">${esc(e.name)}</td>`+(withBasis?`<td rowspan="${rs}" class="l">${nl(e.basis)}</td>`:'')+`<td class="nw" rowspan="${rs}">${esc(e.reason)}</td><td class="mt" rowspan="${rs}">${nl(e.methodText)}</td>`; }
      h+=`<td class="nw">${esc(s.subj)}</td><td class="nw">${fmt(s.base)}</td><td class="nw">${fmt(s.score)}</td></tr>`;
    });
  });
  return h+'</table>';
}
function notesHTML(rows, kind){
  const multi={}; rows.forEach(r=>multi[r.sid]=(multi[r.sid]||0)+1);
  return rows.map((r,i)=>{
    const lab = `${esc(r.name)}(${esc(r.sid)})` + (kind==='perf'&&multi[r.sid]>1?` - ${esc(r.area)}`:'') + (kind==='exam'?` - ${esc(r.exam)}`:'');
    let s=`<p class="note">${i+1}) ${lab}: ${nl(r.note)}</p>`;
    if(kind==='perf'&&r.formula) s+=`<p class="formula">- 계산식: ${esc(r.formula)}</p>`;
    if(kind==='exam'&&r.subjects.length&&r.methodText&&(r.methodText.includes('%'))){ const R=r.methodText.match(/([\d.]+)%/); if(R) s+=r.subjects.map(x=>`<p class="formula">- ${esc(x.subj)}: ${fmt(x.base)}점 × ${num(R[1])/100} = ${fmt(x.score)}점</p>`).join(''); }
    return s;
  }).join('');
}
function regHTML(parts){ return parts.filter(Boolean).map(t=>`<p>${nl(t)}</p>`).join(''); }
function minutesRegParts(m){
  const g=CFG.reg, hasT=[...m.perf,...m.exam].some(r=>r.reason==='전입');

}
function perfSectionHTML(m, P){

const F=(label,k,val,attrs='',cls='')=>`<label class="f ${cls}"><span>${label}</span><input data-k="${k}" value="${esc(val??'')}" ${attrs}></label>`;
const SEL=(label,k,val,opts,attrs='',cls='')=>`<label class="f ${cls}"><span>${label}</span><select data-k="${k}" ${attrs}>${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${String(v)===String(val??'')?' selected':''}>${esc(t)}</option>`;}).join('')}</select></label>`;

function areasOf(subj,grade){ const sc=subjCfg(subj); return sc?split(sc.areas[grade]):[]; }
function areaField(r,k,m){
  const A=areasOf(r.subj||subjName(m), m.grade);
  if(!A.length) return F('평가명(본교)',k+'.area',r.area,'placeholder="예: 국어 탐구 포트폴리오"','w2');
  const custom = r._areaCustom || (r.area && !A.includes(r.area));
  const opts=[['','— 평가 선택 —'],...A,['__custom','직접 입력']];
  return `<label class="f w2"><span>평가명(본교) <small style="color:#1d8a4e">평가부 지정 영역</small></span><select data-areasel="${k}">${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o]; const sel=custom?v==='__custom':String(v)===String(r.area||''); return `<option value="${esc(v)}"${sel?' selected':''}>${esc(t)}</option>`;}).join('')}</select></label>`
    + (custom?F('평가명 직접 입력',k+'.area',r.area,'placeholder="평가명을 입력하세요"','w2'):'');
}
function perfCard(r,i,P,m){
  const k=`${P}.${i}`;

  if(r.method==='avg') mf = F('결시고사(이 평가) 평균',k+'.avgAbs',r.avgAbs,'inputmode="decimal" placeholder="예: 76"')+F('응시(기준)고사명',k+'.otherArea',r.otherArea,'placeholder="예: 학습과정 포트폴리오"')+F('응시(기준)고사 평균',k+'.avgTake',r.avgTake,'inputmode="decimal" placeholder="예: 98.6"')+F('학생의 응시(기준)고사 점수',k+'.takeScore',r.takeScore,'inputmode="decimal"')+F('인정 비율(%)',k+'.ratio',r.ratio,'inputmode="decimal"');

   <div class="grid">
    ${F('학번',k+'.sid',r.sid,`list="dlRoster" data-sid="${k}" placeholder="예: 3129"`)}
    ${F('이름',k+'.name',r.name)}
    ${SEL('인정 사유',k+'.reason',r.reason,REASONS,`data-rr data-def="${k}"`)}
    ${r.reason==='기타'?F('사유 직접 입력',k+'.reasonText',r.reasonText):''}

   <textarea data-k="${k}.note" data-note="${k}" data-kind="perf" rows="3"></textarea>

function updateComputed(){
  const R=root(), m=ctxM();
  $$('[data-calc="perf"]').forEach(el=>{
    const r=getPath(R,el.dataset.path); if(!r) return; const c=perfCalc(r);
    const ok=!isNaN(c.score)&&isFinite(c.score);

function validateMinutes(m){
  const errs=[], warns=[];
  if(!subjName(m)) errs.push('교과를 선택하세요.');
  if(!m.date) errs.push('날짜를 입력하세요.');
  if(!String(m.teachers).trim()) warns.push('참가교사가 비어 있습니다.');
  if(!m.none && !m.perf.length && !m.exam.length) errs.push('학생을 추가하거나 ‘대상 없음’에 체크하세요.');
  if(!m.none){
    m.perf.forEach((r,i)=>{ const c=perfCalc(r); if(!r.sid||!r.name) errs.push(`수행평가 ${i+1}: 학번·이름을 입력하세요.`); if(!r.area) warns.push(`수행평가 ${i+1}: 평가명이 비어 있습니다.`); if(isNaN(c.score)||!isFinite(c.score)) errs.push(`수행평가 ${i+1}(${r.name||''}): 인정점이 계산되지 않았습니다.`); if(r.sid&&rosterOf(m.grade).length&&!findStu(m.grade,r.sid)) warns.push(`수행평가 ${i+1}: 학번 ${r.sid}은(는) 평가부 명단에 없습니다. 학번을 확인하세요.`); else if(r.sid){ const s=findStu(m.grade,r.sid); if(s&&s.name!==r.name) warns.push(`학번 ${r.sid}: 명단의 이름(${s.name})과 다릅니다.`); } });
    m.exam.forEach((e,i)=>{ if(!e.sid||!e.name) errs.push(`정기시험 ${i+1}: 학번·이름을 입력하세요.`); e.subjects.forEach(s=>{ if(isNaN(examCalc(e,s))) errs.push(`정기시험 ${i+1}(${e.name||''}): 점수를 입력하세요.`); }); if(e.sid&&rosterOf(m.grade).length&&!findStu(m.grade,e.sid)) warns.push(`정기시험 ${i+1}: 학번 ${e.sid}은(는) 평가부 명단에 없습니다.`); });
  }
  return {errs,warns};
}

function generateTableHTML(){

  const subjIdx=s=>{ const i=ord.indexOf(s); return i<0?999:i; };

  perf.sort((a,b)=>String(a.sid).localeCompare(String(b.sid),undefined,{numeric:true})||subjIdx(a.subj)-subjIdx(b.subj)||a._i-b._i);

let XLSX_P=null;
function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX); if(XLSX_P) return XLSX_P;
  XLSX_P=new Promise((ok,no)=>{ const sc=document.createElement('script'); sc.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'; sc.onload=()=>ok(window.XLSX); sc.onerror=()=>{ XLSX_P=null; no(new Error('엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하거나, 엑셀에서 “CSV로 저장”한 파일을 넣어 주세요.')); }; document.head.appendChild(sc); });
  return XLSX_P; }
function parseCSV(t){ const rows=[]; let row=[],cell='',q=false; t=t.replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(cell);cell='';} else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';} else if(c!=='\r') cell+=c; }
  if(cell||row.length){row.push(cell);rows.push(row);} return rows; }
async function readSheets(file){
  if(/\.csv$/i.test(file.name)){ const buf=await file.arrayBuffer(); let t=new TextDecoder('utf-8').decode(buf); if(t.includes('\uFFFD')) t=new TextDecoder('euc-kr').decode(buf); return [{name:'',rows:parseCSV(t)}]; }
  const X=await loadXLSX(); const wb=X.read(await file.arrayBuffer(),{type:'array'});
  return wb.SheetNames.map(n=>({name:n, rows:X.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})}));
}
function areasFromSheets(sheets){
  const out={}; // out[g][subject] = {areas:[], teachers:''}
  let found=false;
  sheets.forEach(sh=>{
    const rows=sh.rows.map(r=>r.map(c=>String(c??'').trim()));
    const hi=rows.slice(0,15).findIndex(r=>r.some(c=>/영역|평가명|수행/.test(c)));
    if(hi<0) return;
    const H=rows[hi]; found=true;
    const gi=H.findIndex(c=>/^학년$|학년\s*$/.test(c)&&!/영역|평가/.test(c));
    const si=H.findIndex(c=>/교과|과목/.test(c)&&!/영역|평가명/.test(c));
    const ti=H.findIndex(c=>/교사|담당/.test(c));
    const ais=H.map((c,i)=>i).filter(i=>i!==gi&&i!==si&&i!==ti&&/영역|평가명|수행/.test(H[i]));
    const mg=String(sh.name).match(/([123])\s*학년/); let g=mg?mg[1]:CE_G, s='';
    rows.slice(hi+1).forEach(r=>{
      if(gi>=0&&r[gi]){ const m=r[gi].match(/[123]/); if(m) g=m[0]; }
      if(si>=0&&r[si]) s=r[si].replace(/\s*\(.*?\)\s*$/,'').trim();
      if(!s) return;
      const areas=ais.flatMap(i=>split(r[i]));
      const o=((out[g]=out[g]||{})[s]=(out[g][s]||{areas:[],teachers:''}));
      areas.forEach(a=>{ if(!o.areas.includes(a)) o.areas.push(a); });
      if(ti>=0&&r[ti]) o.teachers=o.teachers?(o.teachers.includes(r[ti])?o.teachers:o.teachers+', '+r[ti]):r[ti];

const cellsOf = rows=>rows.map(r=>r.map(c=>String(c??'').replace(/\s+/g,' ').trim()));
function headInfo(rows){
  const txt=rows.slice(0,12).map(r=>r.join(' ')).join(' ');
  const m=txt.match(/(\d{4})\s*학년도\s*(\d)\s*학기.*?(\d)\s*학년(?!도)/);
  return m?{year:m[1],sem:m[2],grade:m[3],txt}:{year:'',sem:'',grade:'',txt};
}
function mapReason(name, change){
  const n=String(name||''), c=String(change||'');
  if(/전입|편입/.test(c)) return {reason:'전입',reasonText:''};
  if(/질병/.test(n)) return {reason:'질병결',reasonText:''};
  if(/미인정|무단/.test(n)) return {reason:'미인정결',reasonText:''};
  if(/출석인정|인정/.test(n)) return {reason:'인정결',reasonText:''};
  if(/전입|편입/.test(n)) return {reason:'전입',reasonText:''};
  return n?{reason:'기타',reasonText:n}:{reason:'질병결',reasonText:''};
}
function absFromSheets(sheets){
  const out=[];
  sheets.forEach(sh=>{
    const rows=cellsOf(sh.rows); const H=headInfo(rows); const top=rows.slice(0,12).map(r=>r.join(' ')).join(' ');
    const type=/정기시험\s*결시생\s*명단/.test(top)?'exam':(/수행평가\s*결시생\s*명단/.test(top)?'perf':''); if(!type) return;
    const hi=rows.findIndex(r=>r.includes('성명')&&r.some(c=>/결시/.test(c))); if(hi<0) return;
    const h=rows[hi], col=re=>h.findIndex(c=>re.test(c));
    const cBan=col(/^반$/), cNo=col(/^번호$/), cName=col(/^성명$/), cItem=type==='exam'?col(/과목|교과/):col(/영역|평가/), cRs=col(/결시/), cCh=col(/학적/);
    const em=top.match(/고사\s*:\s*(\d)\s*차/); const exam=em?em[1]+'차 시험':'1차 시험';
    const sm=top.match(/교과목\s*:\s*(\S+)/); const subject=sm?sm[1].trim():'';
    const recs=[];
    for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; const name=r[cName]||''; if(!name) continue;
      const ban=parseInt(parseFloat(r[cBan])), no=parseInt(parseFloat(r[cNo])); if(isNaN(ban)||isNaN(no)) continue;
      const sid=`${H.grade}${ban}${String(no).padStart(2,'0')}`; const rs=mapReason(r[cRs], cCh>=0?r[cCh]:'');
      recs.push({sid,name,...rs,item:cItem>=0?r[cItem]:''}); }
    out.push({type,year:H.year,sem:H.sem,grade:H.grade,exam,subject,recs});
  });
  return out;
}
function isIlram(sheets){ return sheets.some(sh=>cellsOf(sh.rows).slice(0,8).some(r=>r.some(c=>/학급별\s*일람표/.test(c)))); }
function ilramFromSheets(sheets){
  const out={};
  sheets.forEach(sh=>{
    const rows=cellsOf(sh.rows); const H=headInfo(rows); if(!H.grade) return;
    const hi=rows.findIndex(r=>r.includes('성명')); if(hi<0) return;
    const head=rows[hi], areaRow=rows[hi+1]||[]; const start=head.indexOf('성명')+1;
    let cur=''; for(let c=start;c<Math.max(head.length,areaRow.length);c++){
      const hv=head[c]||''; if(/합\s*계|비\s*고|총\s*점/.test(hv)) break; if(hv) cur=hv.replace(/\s*\(.*?\)\s*$/,'');
      const a=areaRow[c]||''; if(!cur||!a||/만점/.test(a)) continue;
      const o=((out[H.grade]=out[H.grade]||{})[cur]=(out[H.grade][cur]||{areas:[],teachers:''})); if(!o.areas.includes(a)) o.areas.push(a);
    }
  });
  return out;
}
function mergeExamInto(list, ctx, rec){ // rec: {sid,name,reason,reasonText,exam,subj,base}
  let e=list.find(o=>o.sid===rec.sid&&o.reason===rec.reason&&o.exam===rec.exam);
  let added=false;

  if(rec.name&&!e.name) e.name=rec.name;

}

  loadExist(){ if(!EXIST) return; const v=clone(EXIST); if(!CFG.subjects.some(s=>s.name===v.subject)){ v.subjectCustom=v.subject; v.subject='__custom'; } M=Object.assign(newMinutes(),v); delete M.submittedAt; rerender(); toast('제출된 내용을 불러왔습니다.'); },
  resetM(){ if(confirm('작성 중인 내용을 모두 지우고 새로 작성할까요?')){ const keep={grade:M.grade,sem:M.sem,year:M.year}; M=Object.assign(newMinutes(),keep); rerender(); } },
  tab(d){ AD.tab=d.t; if(d.t==='settings') startSettings(); if(d.t==='gen') AD.gen=''; rerender(); },
  async reload(){ await busy('최신 자료 불러오는 중',loadAdminData(true)); AD.gen=''; rerender(); toast('최신 자료를 불러왔습니다.'); },
  viewM(d){ AD.viewKey=d.key; rerender(); },
  closeView(){ AD.viewKey=''; rerender(); },
  printOne(d){ const x=AD.minutes.find(x=>x.key===d.key); if(x) printDocs([minutesHTML(x.m)]); },
  printSel(){ const L=sortedMinutes().filter(x=>AD.sel.includes(x.key)); if(!L.length){ alert('인쇄할 협의록을 선택하세요.'); return; } printDocs(L.map(x=>minutesHTML(x.m))); },
  printAll(){ printDocs(sortedMinutes().map(x=>minutesHTML(x.m))); },
  async delM(d){ const x=AD.minutes.find(x=>x.key===d.key); if(!x||!confirm(`${subjName(x.m)} 협의록을 삭제할까요? (되돌릴 수 없습니다)`)) return; try{ await busy('삭제하는 중',(async()=>{ await api('remove',{key:d.key}); await loadAdminData(); })()); AD.viewKey=''; rerender(); toast('삭제했습니다.'); }catch(e){ alert(e.message); } },
  async saveExams(){ try{ await busy('저장하는 중',api('set',{key:examKey(), value:{exams:AD.exams, savedAt:new Date().toISOString()}})); toast('저장했습니다.'); }catch(e){ alert('저장 실패: '+e.message); } },
  async genTable(){ await busy('부여표 만드는 중',loadAdminData()); AD.gen=generateTableHTML(); rerender(); },
  printGen(){ printDocs([AD.gen]); },
  async connect(){
    const u=String(CE.apiUrl||'').trim(); const st=$('#connState');
    if(!u){ alert('주소를 넣어 주세요.'); return; }
    if(u!=='demo' && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){ alert('Apps Script 웹 앱 주소(https://script.google.com/macros/s/…/exec)를 넣어 주세요.'); return; }
    const old=API_URL; API_URL=u; if(st) st.textContent='연결 확인 중…';
    try{ await api('ping'); localStorage.setItem('kc_api',u); updateApiState(); const ok=await ensureAuth(); if(!ok) return; await loadCfg(); await loadAdminData(); startSettings(); rerender(); toast('연결되었습니다.'); }
    catch(e){ API_URL=old; if(st) st.textContent=''; alert('연결 실패: '+e.message); }
  },
  async doLogin(){ const pw=($('#pw1')||{}).value||''; if(!pw){ alert('비밀번호를 입력하세요.'); return; }
    const card=$('#pw1').closest('.card'); $$('[data-act="doLogin"]').forEach(b=>b.disabled=true); progStart(card); progTo(5,35);
    try{ const a=await api('auth',{pw}); if(!a.valid){ progFail(); renderLock('login','비밀번호가 맞지 않습니다.'); return; } ADMIN_PW=pw; localStorage.setItem('kc_pw',pw); await afterLogin(); toast('로그인했습니다.'); }catch(e){ progFail(); alert(e.message); } },
  async doCreatePw(){ const a=($('#pw1')||{}).value||'', b=($('#pw2')||{}).value||''; if(a.length<4){ alert('비밀번호는 4자 이상으로 해 주세요.'); return; } if(a!==b){ alert('두 비밀번호가 다릅니다.'); return; }
    const card=$('#pw1').closest('.card'); $$('[data-act="doCreatePw"]').forEach(x=>x.disabled=true); progStart(card); progTo(5,35);
    try{ await api('initpw',{newpw:a}); ADMIN_PW=a; localStorage.setItem('kc_pw',a); await afterLogin(); toast('비밀번호를 만들었습니다. 잊지 않게 따로 적어 두세요.',5000); }catch(e){ progFail(); alert(e.message); } },
  resetServer(){ if(confirm('이 컴퓨터에 저장된 서버 주소를 지우고 설정 화면으로 갈까요?')){ localStorage.removeItem('kc_api'); localStorage.removeItem('kc_pw'); location.href=location.pathname+'?admin'; } },
  async changePw(){ const a=String(CE.newpw||''), b=String(CE.newpw2||''); if(a.length<4){ alert('새 비밀번호는 4자 이상으로 해 주세요.'); return; } if(a!==b){ alert('두 비밀번호가 다릅니다.'); return; }
    try{ await busy('비밀번호 바꾸는 중',api('changepw',{newpw:a})); ADMIN_PW=a; localStorage.setItem('kc_pw',a); CE.newpw=''; CE.newpw2=''; rerender(); toast('비밀번호를 바꿨습니다.'); }catch(e){ alert(e.message); } },
  logout(){ if(confirm('이 컴퓨터에서 평가부장 로그아웃할까요? 다음에 들어올 때 비밀번호를 다시 넣어야 합니다.')){ ADMIN_PW=''; localStorage.removeItem('kc_pw'); renderLock('login'); } },
  copy(d){ navigator.clipboard.writeText(d.v).then(()=>toast('복사했습니다.'),()=>prompt('복사하세요',d.v)); },
  copyTeachers(d){ const f=d.from, t=CE_G; const n=CE.subjects.filter(s=>String(s.teachers[f]||'').trim()).length; if(!n){ alert(`${f}학년에 입력된 참가교사가 없습니다.`); return; }
    const over=CE.subjects.some(s=>String(s.teachers[t]||'').trim()&&String(s.teachers[f]||'').trim());
    let fillAll=true; if(over) fillAll=confirm(`${t}학년에 이미 적힌 참가교사가 있습니다.\n\n[확인] ${f}학년 내용으로 모두 덮어쓰기\n[취소] 비어 있는 칸만 채우기`);
    let c=0; CE.subjects.forEach(s=>{ const v=String(s.teachers[f]||'').trim(); if(!v) return; if(fillAll||!String(s.teachers[t]||'').trim()){ s.teachers[t]=v; c++; } });
    rerender(); toast(`${f}학년 참가교사 ${c}개 교과를 ${t}학년으로 가져왔습니다. ‘설정 저장’을 눌러 주세요.`,4000); },
  importXls(){ $('#xlsFile').click(); },
  async xlsTemplate(){ try{ const X=await loadXLSX(); const rows=[['학년','교과','수행평가 영역','참가교사']]; ['1','2','3'].forEach(g=>CE.subjects.forEach(s=>rows.push([g+'학년',s.name,s.areas[g]||'',s.teachers[g]||'']))); const ws=X.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:8},{wch:12},{wch:50},{wch:24}]; const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,'수행평가 영역'); X.writeFile(wb,'수행평가영역_양식.xlsx'); }catch(e){ alert(e.message); } },
  addSubj(){ CE.subjects.push({name:'',teachers:{1:'',2:'',3:''},areas:{1:'',2:'',3:''}}); rerender(); },
  delSubj(d){ if(confirm(`'${CE.subjects[+d.i].name}' 교과를 목록에서 뺄까요?`)){ CE.subjects.splice(+d.i,1); rerender(); } },
  resetReg(){ if(confirm('규정 문구를 기본값으로 되돌릴까요?')){ CE.reg=Object.assign({},REG_DEFAULT); rerender(); } },
  async saveCfg(){
    if(!API_URL){ alert('먼저 서버를 연결하세요.'); return; }
    const c={year:+CE.year||new Date().getFullYear(), approvalLabels:CE.approvalLabels, approvalSigns:CE.approvalSigns,
      subjects:CE.subjects.filter(s=>String(s.name).trim()).map(s=>({name:s.name.trim(),teachers:s.teachers,areas:s.areas})),
      roster:{1:[],2:[],3:[]}, reg:CE.reg};
    try{ await busy('설정 저장하는 중',api('set',{key:'config', value:c})); CFG=normalizeCfg(c); localStorage.setItem('kc_cfg_cache',JSON.stringify(CFG)); startSettings(); rerender(); toast('설정을 저장했습니다. 교사 화면에 바로 반영됩니다.'); }
    catch(e){ alert('저장 실패: '+e.message); }
  }
};

let RENDERING=false;
function rerender(){ if(RENDERING){ setTimeout(rerender,0); return; } RENDERING=true; try{ const y=window.scrollY; if(VIEW==='teacher') renderTeacher(); else renderAdmin(); window.scrollTo(0,y); saveDraft(); } finally { RENDERING=false; } }

document.addEventListener('toggle',e=>{ if(e.target&&e.target.id==='pasteBox') AD.pasteOpen=e.target.open; if(e.target&&e.target.id==='absPasteBox') AD.absPasteOpen=e.target.open; },true);
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; e.preventDefault(); const f=ACT[b.dataset.act]; if(f) f(b.dataset,b); });
document.addEventListener('input',e=>{
  const el=e.target, k=el.dataset.k; if(!k) return;
  const R=root(); if(!R) return;
  setPath(R,k, el.type==='checkbox'?el.checked:el.value);
  if(el.dataset.note){ const o=getPath(R,el.dataset.note); o.noteEdited=true; }
  refresh();
});
document.addEventListener('change',e=>{ setTimeout(()=>onChange(e),0); });
async function onChange(e){
  const el=e.target; const R=root(); if(!R||!el.dataset) return;
  if(el.dataset.areasel){ const o=getPath(R,el.dataset.areasel); if(el.value==='__custom'){ o._areaCustom=true; o.area=''; } else { o._areaCustom=false; o.area=el.value; } rerender(); return; }
  if(el.dataset.selkey){ const k=el.dataset.selkey; AD.sel=(AD.sel||[]).filter(x=>x!==k); if(el.checked) AD.sel.push(k); rerender(); return; }
  if(el.dataset.selall!==undefined){ AD.sel=el.checked?AD.minutes.map(x=>x.key):[]; rerender(); return; }
  if(el.id==='xlsFile'){ const fs=[...(el.files||[])]; el.value=''; if(fs.length) importAreasFile(fs); return; }
  if(el.id==='absFile'){ const fs=[...(el.files||[])]; el.value=''; if(fs.length) importAbsFiles(fs); return; }
  if(el.dataset.ceg!==undefined){ CE_G=el.value; rerender(); return; }
  if(el.dataset.sid){ // 학번 → 이름·사유 자동
    const o=getPath(R,el.dataset.sid); const g=VIEW==='teacher'?M.grade:AD.grade; const s=findStu(g,o.sid);
    if(s){ o.name=s.name; const rs=REASONS.includes(s.reason)?s.reason:(s.reason?'기타':o.reason); if(rs!==o.reason||(rs==='기타'&&o.reasonText!==s.reason)){ o.reason=rs; if(rs==='기타') o.reasonText=s.reason; if(el.dataset.kind==='exam') applyExamDefaults(o); else applyPerfDefaults(o); } rerender(); }
    return;
  }
  if(el.dataset.def){ const o=getPath(R,el.dataset.def); if(el.dataset.kind==='exam') applyExamDefaults(o); else applyPerfDefaults(o); }
  if(el.dataset.exam){ const o=getPath(R,el.dataset.exam); o.otherExam=o.exam==='1차 시험'?'2차 시험':'1차 시험'; }
  if(el.dataset.subj!==undefined && VIEW==='teacher'){ const sc=subjCfg(subjName(M)); if(sc&&sc.teachers[M.grade]) M.teachers=sc.teachers[M.grade]; }
  if(VIEW==='admin' && (el.dataset.k==='year'||el.dataset.k==='grade'||el.dataset.k==='sem') && AD.tab!=='settings'){ AD.viewKey=''; AD.gen=''; await loadAdminData(); rerender(); return; }
  if(el.dataset.rr!==undefined) rerender();
  if(el.dataset.chk!==undefined && VIEW==='teacher') checkExisting();
}

let SRV={st:'chk', why:''};
function setSrv(st,why){ SRV={st,why:why||''}; updateApiState(); }
function updateApiState(){
  const s=$('#apiState'); if(!s) return;
  let st=SRV.st; if(!API_URL) st='none'; else if(API_URL==='demo') st='demo';
  const T={none:'⚠ 서버 주소 없음', demo:'● 연습 모드', chk:'… 연결 확인 중', ok:'● 서버 연결됨', fail:'⚠ 서버 연결 안 됨'};
  s.className=st; s.textContent=T[st]; s.title=(st==='fail'||st==='none')?'눌러서 원인과 해결 방법 보기':'';
}
function srvHelp(){
  let st=SRV.st; if(!API_URL) st='none'; else if(API_URL==='demo') return;
  if(st==='ok'||st==='chk') return;
  if(VIEW==='teacher'){
    alert(st==='none'
      ? '서버 주소가 없습니다.\n\n평가부장에게 받은 “교사용 링크”로 다시 접속해 주세요. 그래야 ‘보내기’가 됩니다. (작성·인쇄는 지금도 됩니다)'
      : '서버(구글 시트)에 연결되지 않았습니다.\n\n1. 인터넷이 연결되어 있는지 확인하세요.\n2. 평가부장에게 받은 교사용 링크로 다시 접속해 보세요.\n3. 학교 업무망에서 구글 서비스가 막혀 있을 수 있습니다. 다른 인터넷(무선 등)에서 열어 보세요.\n4. 계속 안 되면 평가부장에게 알려 주세요.\n\n작성한 내용은 이 컴퓨터에 저장되어 있으니 사라지지 않습니다.');
    return;
  }
  const why={network:'서버에 닿지 못했습니다 (주소가 틀렸거나, 인터넷·학교망 문제).', timeout:'서버 응답이 너무 늦습니다.', badjson:'서버가 앱이 읽을 수 없는 응답을 보냈습니다 (대개 배포 권한 문제).'}[SRV.why]||'';
  alert(st==='none'
    ? '서버 주소가 없습니다.\n\n④ 설정에서 Apps Script 웹 앱 주소(…/exec)를 넣고 ‘연결하기’를 누르세요.'
    : `서버에 연결되지 않았습니다.\n${why}\n\n확인할 것:\n1. Apps Script 배포 → 배포 관리에서 ‘실행 사용자: 나’, ‘액세스 권한: 모든 사용자’인지\n2. ④ 설정의 주소가 https://script.google.com/macros/s/…/exec 형태인지 (/dev, /edit 아님)\n3. Code.gs를 고쳤다면 ‘새 버전’으로 다시 배포했는지\n4. 학교 업무망에서 script.google.com이 막혀 있지 않은지 (다른 인터넷에서 열어 보기)\n\n고친 뒤 이 화면을 새로고침(Ctrl+F5) 하세요.`);
}
async function init(){
  $('#verTag').textContent='v'+APP_VERSION; $('#verFoot').textContent=`버전 ${APP_VERSION} (${APP_DATE})`;
  $('#modeLabel').textContent = VIEW==='teacher'?'교과 교사용':'평가부장용';
  const sw=$('#modeSwitch');
  if(VIEW==='teacher'){ sw.remove(); const ft=$('footer'); ft.innerHTML=ft.innerHTML.replace(/\s*·\s*$/,''); }
  else { sw.textContent='교사 화면 (새 탭)'; sw.href='?'+(API_URL?'api='+encodeURIComponent(API_URL):''); sw.target='_blank'; sw.rel='noopener'; }
  $('#apiState').addEventListener('click',srvHelp);
  setSrv('chk');
  let cfgErr='';
  try{ await loadCfg(); }catch(e){ cfgErr=e.message; }
  if(VIEW==='teacher'){
    const d=localStorage.getItem('kc_draft');
    M = d ? Object.assign(newMinutes(), JSON.parse(d)) : newMinutes();
    renderTeacher();
    checkExisting();
  } else {
    AD.year=String(CFG.year); AD.sem=curSem();
    if(!API_URL){ AD.tab='settings'; renderAdmin(); }
    else {
      $('#app').innerHTML='<div class="card" style="max-width:440px;margin:40px auto" id="bootCard"><h2>평가부장 화면</h2></div>'; progStart($('#bootCard')); progTo(10,45);
      let ok=false; try{ ok=await ensureAuth(); }catch(e){ clearInterval(PROG.h); AD.tab='settings'; renderAdmin(); toast('서버 연결 실패: '+e.message,5000); return; }
      if(ok){ progTo(50,95); await loadAdminData(); progEnd(); await new Promise(r=>setTimeout(r,200)); renderAdmin(); } else clearInterval(PROG.h);
    }
  }
  if(cfgErr) toast('서버에서 설정을 불러오지 못했습니다: '+cfgErr, 5000);
}
init();
